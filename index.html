<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Feli pumple :)</title>

  <!-- Tipografía (si no hay internet, cae a Georgia sin romper nada) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&display=swap" rel="stylesheet">

  <style>
    /* ============ Paleta y medidas ============ */
    :root {
      --bg:      #e6e7f3;   /* niebla lavanda */
      --ink:     #2e2440;   /* ciruela profundo */
      --muted:   #8d86a3;
      --sponge:  #f3d9a0;   /* bizcocho */
      --frost:   #fffdf8;   /* betún */
      --filling: #f08a8a;   /* relleno / vela */
      --plate:   #d3d3e6;
      --butter:  #f2c94c;
      --mint:    #7cc6a4;
      --plum:    #6b5b95;
      --sky:     #7fa7d9;

      --font: "Fraunces", Georgia, "Times New Roman", serif;
      --ease-out: cubic-bezier(.2, .7, .2, 1);

      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    *, *::before, *::after { box-sizing: inherit; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font);
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    /* ============ Escenario ============ */
    .stage {
      position: relative;
      z-index: 2;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(1.25rem, 4vh, 2.5rem);
      padding: 1.5rem;
      text-align: center;
    }

    .title {
      font-style: italic;
      font-weight: 400;
      font-size: clamp(2.6rem, 10vw, 4.75rem);
      line-height: 1;
      letter-spacing: -0.02em;
      min-height: 1.1em;               /* reserva espacio: nada salta */
      opacity: 0;
      transform: translateY(14px);
      transition: opacity 1s ease, transform 1.3s var(--ease-out);
    }
    .show-title .title { opacity: 1; transform: none; }

    /* ============ Pastel ============ */
    .cake {
      position: relative;
      width: min(230px, 56vw);
    }
    .cake svg { display: block; width: 100%; height: auto; overflow: visible; }

    /* botón invisible sobre la vela (área táctil cómoda) */
    .candle-hit {
      position: absolute;
      left: 30%; top: 0;
      width: 40%; height: 56%;
      background: none;
      border: 0;
      border-radius: 40%;
      cursor: pointer;
    }
    .candle-hit:focus-visible { outline: 2px solid var(--plum); outline-offset: 4px; }
    .candle-hit:disabled { cursor: default; }

    /* La flama: tres capas con ritmos distintos para que no se note el loop */
    .flame-out, .flame-sway, .flame-flicker, .glow {
      transform-box: fill-box;
      transform-origin: 50% 100%;
    }
    .glow { transform-origin: 50% 50%; animation: glow 2.6s ease-in-out infinite alternate; }
    .flame-sway    { animation: sway 2.3s ease-in-out infinite alternate; }
    .flame-flicker { animation: flicker 1.7s ease-in-out infinite alternate; }

    @keyframes sway {
      0%   { transform: rotate(-3deg); }
      50%  { transform: rotate(1.5deg); }
      100% { transform: rotate(3deg); }
    }
    @keyframes flicker {
      0%   { transform: scale(1, 1); }
      40%  { transform: scale(.95, 1.06); }
      70%  { transform: scale(1.03, .97); }
      100% { transform: scale(.97, 1.04); }
    }
    @keyframes glow {
      from { opacity: .45; transform: scale(.94); }
      to   { opacity: .7;  transform: scale(1.06); }
    }

    .flame-out, .glow-wrap {
      transition: transform .5s cubic-bezier(.5, 0, .75, 0), opacity .45s ease-in;
    }
    .glow-wrap { transform-box: fill-box; transform-origin: 50% 50%; }
    .blown .flame-out { transform: scale(.25, 0); opacity: 0; }
    .blown .glow-wrap { transform: scale(.4); opacity: 0; }

    /* Humito al apagarse */
    .smoke {
      fill: none;
      stroke: var(--muted);
      stroke-width: 1.4;
      stroke-linecap: round;
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      opacity: 0;
    }
    .blown .smoke { animation: smoke 2s ease-out .25s forwards; }
    @keyframes smoke {
      0%   { stroke-dashoffset: 1; opacity: .7; transform: translateY(0); }
      100% { stroke-dashoffset: 0; opacity: 0;  transform: translateY(-10px); }
    }

    /* ============ Texto inferior ============ */
    .below {
      display: grid;
      place-items: center;
      min-height: 3.2em;
    }
    .below > * { grid-area: 1 / 1; }

    .hint {
      font-size: clamp(.95rem, 3.4vw, 1.1rem);
      color: var(--muted);
      transition: opacity .5s ease;
    }
    .hint span { animation: breathe 3s ease-in-out infinite; }
    @keyframes breathe { 50% { opacity: .45; } }
    .blown .hint { opacity: 0; }

    .msg {
      font-size: clamp(1.05rem, 4vw, 1.35rem);
      font-weight: 400;
      max-width: 28ch;
      line-height: 1.45;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 1.1s ease, transform 1.3s var(--ease-out);
    }
    .show-msg .msg { opacity: 1; transform: none; }

    .replay {
      position: absolute;
      left: 50%;
      bottom: calc(1.5rem + env(safe-area-inset-bottom, 0px));
      translate: -50% 0;
      font: inherit;
      font-size: .9rem;
      color: var(--muted);
      background: none;
      border: 1px solid color-mix(in srgb, var(--muted) 45%, transparent);
      border-radius: 999px;
      padding: .45em 1.1em;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: opacity .8s ease, color .2s, border-color .2s;
    }
    .replay:hover { color: var(--ink); border-color: var(--ink); }
    .replay:focus-visible { outline: 2px solid var(--plum); outline-offset: 3px; }
    .show-replay .replay { opacity: 1; pointer-events: auto; }

    /* ============ Globos ============ */
    .sky {
      position: fixed;
      inset: 0;
      z-index: 1;
      overflow: hidden;
      pointer-events: none;
      opacity: 0;
      transition: opacity 1.2s ease;
    }
    .show-balloons .sky { opacity: 1; }

    .balloon {
      position: absolute;
      bottom: -180px;
      left: var(--x);
      width: clamp(42px, 8vw, 60px);
      margin-left: calc(clamp(42px, 8vw, 60px) / -2);
      animation: rise var(--dur) linear var(--delay) infinite backwards;
    }
    .balloon .sway { animation: balloonSway var(--swayDur) ease-in-out infinite alternate; }
    .balloon svg { display: block; width: 100%; height: auto; }

    @keyframes rise {
      from { transform: translateY(0); }
      to   { transform: translateY(calc(-100vh - 260px)); }
    }
    @keyframes balloonSway {
      from { transform: translateX(-9px) rotate(-4deg); }
      to   { transform: translateX(9px)  rotate(4deg); }
    }

    /* ============ Confeti ============ */
    #confetti {
      position: fixed;
      inset: 0;
      z-index: 3;
      pointer-events: none;
    }

    /* ============ Menos movimiento si el usuario lo pide ============ */
    @media (prefers-reduced-motion: reduce) {
      .glow, .flame-sway, .flame-flicker, .hint span { animation: none; }
      .balloon, .balloon .sway { animation: none; }
      .sky { display: none; }
    }
  </style>
</head>
<body>

  <canvas id="confetti" aria-hidden="true"></canvas>
  <div class="sky" id="sky" aria-hidden="true"></div>

  <main class="stage">
    <h1 class="title" id="title"></h1>

    <div class="cake">
      <svg viewBox="0 0 200 220" aria-hidden="true">
        <defs>
          <linearGradient id="flameGrad" x1="0" y1="1" x2="0" y2="0">
            <stop offset="0"   stop-color="#f59e42"/>
            <stop offset=".6"  stop-color="#f7c948"/>
            <stop offset="1"   stop-color="#fbe7a1"/>
          </linearGradient>
          <radialGradient id="glowGrad">
            <stop offset="0"  stop-color="#f7c948" stop-opacity=".55"/>
            <stop offset="1"  stop-color="#f7c948" stop-opacity="0"/>
          </radialGradient>
        </defs>

        <!-- plato -->
        <ellipse cx="100" cy="201" rx="88" ry="7" fill="var(--plate)"/>

        <!-- bizcocho -->
        <rect x="32" y="122" width="136" height="78" rx="7" fill="var(--sponge)"/>
        <!-- capa de relleno -->
        <rect x="32" y="163" width="136" height="4" fill="var(--filling)" opacity=".55"/>

        <!-- betún con escurridos -->
        <rect x="30" y="114" width="140" height="18" rx="8" fill="var(--frost)"/>
        <rect x="46"  y="124" width="10" height="17" rx="5" fill="var(--frost)"/>
        <rect x="78"  y="124" width="10" height="11" rx="5" fill="var(--frost)"/>
        <rect x="113" y="124" width="10" height="22" rx="5" fill="var(--frost)"/>
        <rect x="146" y="124" width="10" height="13" rx="5" fill="var(--frost)"/>

        <!-- vela -->
        <rect x="95" y="70" width="10" height="46" rx="2.5" fill="var(--filling)"/>
        <rect x="95" y="70" width="3"  height="46" rx="1.5" fill="#fff" opacity=".25"/>
        <!-- mecha -->
        <line x1="100" y1="70" x2="100" y2="62" stroke="var(--ink)" stroke-width="1.6" stroke-linecap="round"/>

        <!-- brillo -->
        <g class="glow-wrap">
          <circle class="glow" cx="100" cy="50" r="26" fill="url(#glowGrad)"/>
        </g>

        <!-- flama -->
        <g class="flame-out">
          <g class="flame-sway">
            <g class="flame-flicker">
              <path d="M100,38 C106,48 108.5,54 108.5,58 A8.5,8.5 0 0 1 91.5,58 C91.5,54 94,48 100,38 Z" fill="url(#flameGrad)"/>
              <path d="M100,50 C102.6,54 103.6,56.5 103.6,58.5 A3.6,3.6 0 0 1 96.4,58.5 C96.4,56.5 97.4,54 100,50 Z" fill="#fff8e0"/>
            </g>
          </g>
        </g>

        <!-- humo -->
        <path class="smoke" pathLength="1" d="M100,61 C96,52 105,46 100,37 C96,30 103,24 100,15"/>
      </svg>

      <button class="candle-hit" id="candle" aria-label="Apagar la vela"></button>
    </div>

    <div class="below">
      <p class="hint" id="hint"><span></span></p>
      <p class="msg" id="msg"></p>
    </div>

    <button class="replay" id="replay">Encender otra vez</button>
  </main>

  <script>
    /* ===================== EDITA AQUÍ ===================== */
    const TEXTOS = {
      pista:   "Toca la vela",
      titulo:  "Feli pumple :)",
      mensaje: "cumpleaños doble ahdadjka"
    };
    /* ====================================================== */

    const $ = (id) => document.getElementById(id);
    $("hint").firstElementChild.textContent = TEXTOS.pista;
    $("title").textContent   = TEXTOS.titulo;
    $("msg").textContent     = TEXTOS.mensaje;

    const body   = document.body;
    const candle = $("candle");
    const sky    = $("sky");
    const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const css    = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
    const COLORS = ["--filling", "--butter", "--mint", "--plum", "--sky"].map(css);

    /* ---------- Secuencia ---------- */
    let timers = [];
    const later = (fn, ms) => timers.push(setTimeout(fn, ms));

    function blow() {
      if (body.classList.contains("blown")) return;
      body.classList.add("blown");
      candle.disabled = true;

      const r = candle.getBoundingClientRect();
      const ox = r.left + r.width / 2;
      const oy = r.top + r.height * 0.3;

      later(() => { if (!reduce) burst(ox, oy); }, 380);
      later(() => body.classList.add("show-title"), 850);
      later(() => { launchBalloons(); body.classList.add("show-balloons"); }, 2000);
      later(() => body.classList.add("show-msg"), 2900);
      later(() => body.classList.add("show-replay"), 5200);
    }

    function relight() {
      timers.forEach(clearTimeout);
      timers = [];
      body.classList.remove("blown", "show-title", "show-balloons", "show-msg", "show-replay");
      candle.disabled = false;
      setTimeout(() => { if (!body.classList.contains("show-balloons")) sky.innerHTML = ""; }, 1300);
      candle.focus({ preventScroll: true });
    }

    candle.addEventListener("click", blow);
    $("replay").addEventListener("click", relight);

    /* ---------- Globos ---------- */
    const BALLOONS = [
      { x: "10%", color: "--filling", delay: 0,   dur: 13,   sway: 3.1 },
      { x: "84%", color: "--butter",  delay: 1.1, dur: 11.5, sway: 2.7 },
      { x: "26%", color: "--mint",    delay: 2.4, dur: 12.5, sway: 3.4 },
      { x: "68%", color: "--sky",     delay: 3.3, dur: 14,   sway: 2.9 },
      { x: "92%", color: "--plum",    delay: 4.8, dur: 12,   sway: 3.2 }
    ];

    function balloonSVG(fill) {
      return `
        <svg viewBox="0 0 60 130">
          <ellipse cx="30" cy="31" rx="26" ry="30" fill="${fill}"/>
          <ellipse cx="21" cy="20" rx="5" ry="9" fill="#fff" opacity=".3" transform="rotate(-20 21 20)"/>
          <path d="M26,60 L34,60 L30,66 Z" fill="${fill}"/>
          <path d="M30,66 C25,82 35,96 29,128" fill="none" stroke="${css("--muted")}" stroke-width="1"/>
        </svg>`;
    }

    function launchBalloons() {
      if (reduce) return;
      sky.innerHTML = "";
      BALLOONS.forEach((b) => {
        const el = document.createElement("div");
        el.className = "balloon";
        el.style.setProperty("--x", b.x);
        el.style.setProperty("--delay", b.delay + "s");
        el.style.setProperty("--dur", b.dur + "s");
        el.style.setProperty("--swayDur", b.sway + "s");
        el.innerHTML = `<div class="sway">${balloonSVG(css(b.color))}</div>`;
        sky.appendChild(el);
      });
    }

    /* ---------- Confeti (canvas, sin librerías) ---------- */
    const canvas = $("confetti");
    const ctx = canvas.getContext("2d");
    let W, H, parts = [], running = false, last = 0;

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = window.innerWidth; H = window.innerHeight;
      canvas.width = W * dpr; canvas.height = H * dpr;
      canvas.style.width = W + "px"; canvas.style.height = H + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener("resize", resize);
    resize();

    function burst(x, y) {
      const n = W < 600 ? 45 : 70;
      for (let i = 0; i < n; i++) {
        const angle = -Math.PI / 2 + (Math.random() - 0.5) * Math.PI * 0.95;
        const speed = 4 + Math.random() * 6;
        parts.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          w: 5 + Math.random() * 4,
          h: 8 + Math.random() * 6,
          rot: Math.random() * Math.PI,
          vrot: (Math.random() - 0.5) * 0.18,
          flip: Math.random() * Math.PI * 2,
          vflip: 0.05 + Math.random() * 0.08,
          color: COLORS[i % COLORS.length],
          round: Math.random() < 0.3,
          life: 0,
          max: 200 + Math.random() * 90
        });
      }
      if (!running) { running = true; last = performance.now(); requestAnimationFrame(tick); }
    }

    function tick(now) {
      const dt = Math.min((now - last) / 16.67, 3); // misma velocidad a 60 o 120 Hz
      last = now;
      ctx.clearRect(0, 0, W, H);

      parts = parts.filter((p) => p.life < p.max && p.y < H + 30);
      for (const p of parts) {
        p.life += dt;
        p.vx *= Math.pow(0.975, dt);
        p.vy = (p.vy + 0.13 * dt) * Math.pow(0.97, dt);   // cae como papel, no como piedra
        p.x += (p.vx + Math.sin(p.flip) * 0.7) * dt;
        p.y += p.vy * dt;
        p.rot += p.vrot * dt;
        p.flip += p.vflip * dt;

        ctx.save();
        ctx.globalAlpha = Math.max(0, Math.min(1, (p.max - p.life) / 45));
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.scale(1, Math.cos(p.flip));
        ctx.fillStyle = p.color;
        if (p.round) { ctx.beginPath(); ctx.arc(0, 0, p.w / 2, 0, Math.PI * 2); ctx.fill(); }
        else ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        ctx.restore();
      }

      if (parts.length) requestAnimationFrame(tick);
      else { running = false; ctx.clearRect(0, 0, W, H); }
    }
  </script>
</body>
</html>
